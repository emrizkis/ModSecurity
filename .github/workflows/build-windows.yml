name: Build ModSecurity on Windows

on:
  # Izinkan build ini dijalankan manual kapan saja dari tab "Actions"
  workflow_dispatch:
  
  # Jalankan juga saat Anda push perubahan ke branch 'main' Anda
  push:
    branches: [ main ] 

jobs:
  build-windows:
    # Kita akan "meminjam" mesin Windows Server 2022 dari GitHub
    runs-on: windows-latest

    steps:
    - name: 1. Checkout repository
      uses: actions/checkout@v4
      with:
        # Kita checkout branch 'v3/master' yang berisi kode stabil
        ref: 'v3/master' 
        # Ini akan otomatis menjalankan 'git submodule init' dan 'git submodule update'
        submodules: 'recursive'

    # PERUBAHAN 1: Tambahkan 'id' di sini
    - name: 2. Install Visual Studio Build Tools
      uses: microsoft/setup-msbuild@v2
      id: setup_msbuild # <-- ID DITAMBAHKAN DI SINI
      with:
        vs-components: '["Microsoft.VisualStudio.Workload.VCTools"]'

    # PERUBAHAN 2: Ganti metode instalasi Conan
    - name: 3. Install Conan (via pip)
      run: |
        echo "Menginstal Conan menggunakan pip..."
        pip install conan==2.10.2
        echo "Conan berhasil diinstal."
      shell: powershell # Gunakan PowerShell untuk menjalankan pip

    # PERUBAHAN 3: Gunakan path dinamis
    - name: 4. Setup Conan Profile
      run: |
        call "${{ steps.setup_msbuild.outputs.vcvars_path }}"
        conan profile detect --force
      shell: cmd

    # PERUBAHAN 4: Gunakan path dinamis
    - name: 5. Build libModSecurity
      run: |
        call "${{ steps.setup_msbuild.outputs.vcvars_path }}"
        vcbuild.bat Release x86_64
      working-directory: ${{ github.workspace }}
      shell: cmd

    - name: 6. Archive build artifacts
      # Mengumpulkan file .dll dan .lib dari hasil build
      uses: actions/upload-artifact@v4
      with:
        name: modsecurity-windows-build
        path: |
          build/win32/build/Release/*.dll
          build/win32/build/Release/*.lib
