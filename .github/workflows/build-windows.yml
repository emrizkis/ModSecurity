name: Build ModSecurity on Windows

on:
  # 1. Izinkan build ini dijalankan manual kapan saja dari tab "Actions"
  workflow_dispatch:
  
  # 2. Jalankan juga saat Anda push perubahan ke branch 'main' Anda
  push:
    branches: [ main ] 

jobs:
  build-windows:
    # Kita akan "meminjam" mesin Windows Server 2022 dari GitHub
    runs-on: windows-latest

    steps:
    - name: 1. Checkout repository
      uses: actions/checkout@v4
      with:
        # PENTING: Kita checkout branch 'v3/master' yang berisi kode stabil
        ref: 'v3/master' 
        # Ini akan otomatis menjalankan 'git submodule init' dan 'git submodule update'
        submodules: 'recursive'

    - name: 2. Install Visual Studio Build Tools
      # Menginstal komponen 'VCTools' (C++)
      uses: microsoft/setup-msbuild@v2
      with:
        vs-components: '["Microsoft.VisualStudio.Workload.VCTools"]'

    - name: 3. Install Conan
      # Menjalankan perintah PowerShell untuk download & install
      run: |
        Invoke-WebRequest -Uri "https://github.com/conan-io/conan/releases/download/2.10.2/conan-2.10.2-windows-x86_64-installer.exe" -OutFile "C:\TEMP\conan-installer.exe"
        Start-Process -FilePath "C:\TEMP\conan-installer.exe" -ArgumentList "/SP- /VERYSILENT /SUPPRESSMSGBOXES" -Wait
      shell: powershell

    - name: 4. Setup Conan Profile
      # Menjalankan vcvars64.bat untuk setup environment, lalu conan
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
        conan profile detect --force
      shell: cmd

    - name: 5. Build libModSecurity
      # Menjalankan skrip build 'vcbuild.bat'
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
        vcbuild.bat Release x86_64
      # 'vcbuild.bat' ada di root, jadi kita jalankan dari sana
      working-directory: ${{ github.workspace }}
      shell: cmd

    - name: 6. Archive build artifacts
      # Mengumpulkan file .dll dan .lib dari hasil build
      uses: actions/upload-artifact@v4
      with:
        name: modsecurity-windows-build
        # Path ini diambil dari Dockerfile Anda. Seharusnya sudah benar.
        path: |
          build/win32/build/Release/*.dll
          build/win32/build/Release/*.lib
